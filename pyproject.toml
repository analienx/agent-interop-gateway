[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-interop-gateway"
version = "0.1.1"
description = "Model-agnostic delegation gateway for securely handing work from conversational AI surfaces to user-controlled local executors."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Agent Interop Gateway contributors"}]
keywords = ["agents", "interoperability", "local-ai", "automation", "android", "gateway"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "mypy>=1.11,<2",
  "ruff>=0.7,<1",
]

[project.scripts]
aigw = "agent_interop_gateway.cli:main"
aigw-chatgpt-android = "agent_interop_gateway.chatgpt_android:main"
aigw-android-relay = "agent_interop_gateway.android_relay:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_interop_gateway"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true
no_implicit_optional = true
